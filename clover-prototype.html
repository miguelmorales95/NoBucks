<title>Clover</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Sign in -> verify -> build a villager (human or animal) -> land in your animated
     village. Garden / Animal-Crossing cozy palette: sage, cream, coral, sea teal. */
  :root{
    --bg:#dfe9d8; --surface:#fffdf7; --surface-2:#f3efe2; --surface-3:#eae4d3;
    --ink:#35463b; --muted:#73836f; --line:#e6e0cf;
    --accent:#f08a63; --accent-ink:#8a3d23; --teal:#2ca397; --leaf:#6fae4e;
    --gold:#f0b23e; --good:#4e9c6b; --star:#f2b02e;
    --shadow:0 10px 26px rgba(43,58,44,.14); --shadow-soft:0 4px 14px rgba(43,58,44,.08);
    --r-lg:24px; --r-md:18px; --r-sm:12px;
    --map-land:#edefd9; --map-block:#e2e5c7; --map-road:#fbfaf1; --map-park:#cbe0a6;
    --map-water:#bfe2e6; --map-tree:#84b85c;
    --sky-top:#bfe8ee; --sky-bot:#dff2e4; --grass:#aed583; --grass-dk:#8fbf6a;
    --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
    --font-body:"Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1a15; --surface:#1a2820; --surface-2:#223328; --surface-3:#2a3d30;
    --ink:#eaf3ea; --muted:#9db39d; --line:#2e4134;
    --accent:#f3936e; --accent-ink:#ffd9c9; --teal:#39b7a9; --leaf:#86c061;
    --gold:#f3bd56; --good:#6fc08c; --star:#f6c357;
    --map-land:#17241c; --map-block:#1f2f25; --map-road:#2a3b30; --map-park:#2a472d;
    --map-water:#1d4648; --map-tree:#4c7a42;
    --sky-top:#16343a; --sky-bot:#193026; --grass:#2f5a33; --grass-dk:#264a2a;
    --shadow:0 12px 30px rgba(0,0,0,.4); --shadow-soft:0 4px 14px rgba(0,0,0,.3); color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#0f1a15; --surface:#1a2820; --surface-2:#223328; --surface-3:#2a3d30;
    --ink:#eaf3ea; --muted:#9db39d; --line:#2e4134;
    --accent:#f3936e; --accent-ink:#ffd9c9; --teal:#39b7a9; --leaf:#86c061;
    --gold:#f3bd56; --good:#6fc08c; --star:#f6c357;
    --map-land:#17241c; --map-block:#1f2f25; --map-road:#2a3b30; --map-park:#2a472d;
    --map-water:#1d4648; --map-tree:#4c7a42;
    --sky-top:#16343a; --sky-bot:#193026; --grass:#2f5a33; --grass-dk:#264a2a;
    --shadow:0 12px 30px rgba(0,0,0,.4); --shadow-soft:0 4px 14px rgba(0,0,0,.3); color-scheme:dark;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--teal);z-index:60}
  .app{position:relative;max-width:450px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow)}
  @media(min-width:520px){body{padding:22px 0}.app{min-height:calc(100% - 44px);border-radius:30px;overflow:hidden}}

  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:linear-gradient(160deg,var(--teal),#2f8f84);color:#fff;
    padding:14px max(18px,env(safe-area-inset-left,0px)) 16px max(18px,env(safe-area-inset-right,0px));border-bottom:3px solid rgba(0,0,0,.06)}
  .top .hi{display:flex;align-items:center;gap:12px}
  .top .hi .me{width:48px;height:48px;border-radius:50%;background:#dff1ef;overflow:hidden;flex:none;border:3px solid rgba(255,255,255,.6);display:grid;place-items:center}
  .top .hi .me svg{width:112%;height:112%;margin-top:9%}
  .top .hi .who{flex:1;min-width:0}
  .top .hi .who .k{font-size:12px;opacity:.85;letter-spacing:.04em}
  .top .hi .who .n{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.1}
  .wallet{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;
    padding:7px 13px;font-family:var(--font-display);font-weight:600;font-size:16px;color:#fff;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
  .loc{display:flex;align-items:center;gap:5px;margin-top:11px;font-size:12.5px;opacity:.92}
  .brand{position:absolute;top:13px;right:max(18px,env(safe-area-inset-right,0px));font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;opacity:.8}

  .screen{flex:1;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
  .screen.flush{padding:0}
  .screen-title{font-family:var(--font-display);font-weight:600;font-size:22px;margin:4px 2px 2px;text-wrap:balance}
  .screen-sub{color:var(--muted);font-size:13.5px;margin:0 2px 14px}

  .seg{display:flex;gap:7px;background:var(--surface-2);padding:5px;border-radius:14px;margin:0 2px 12px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:9px 4px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin:0 -4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;
    font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .chip .e{font-size:14px}

  .feed{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);overflow:hidden;cursor:pointer;transition:transform .12s ease}
  .card:active{transform:scale(.985)}
  .card .row{display:flex;gap:12px;padding:14px 15px}
  .avatar{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:17px;position:relative}
  .avatar .badge{position:absolute;right:-5px;bottom:-5px;width:23px;height:23px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;border:2px solid var(--surface)}
  .card .body{flex:1;min-width:0}
  .card .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700;flex-wrap:wrap}
  .card .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
  .rate{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-weight:800;white-space:nowrap}
  .rate b{color:var(--ink)}
  .card h3{font-family:var(--font-display);font-weight:600;font-size:16.5px;margin:3px 0 2px;line-height:1.2}
  .card p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 15px 14px}
  .tag{font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .tag.offer{background:rgba(44,163,151,.14);color:var(--teal)}
  .tag.request{background:rgba(240,138,99,.16);color:var(--accent-ink)}
  .tag.pact{background:rgba(240,178,62,.18);color:#9a7417}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.pact{color:var(--gold)}}
  :root[data-theme="dark"] .tag.pact{color:var(--gold)}
  .price{font-family:var(--font-display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .price small{font-weight:700;font-family:var(--font-body);color:var(--muted);font-size:11px}

  .btn{border:none;border-radius:14px;font-family:var(--font-display);font-weight:600;font-size:15px;padding:12px 18px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s,filter .15s;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .btn-primary:hover{filter:brightness(1.03)}
  .btn-teal{background:var(--teal);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}

  .field{margin-bottom:15px}
  .field label{display:block;font-weight:800;font-size:12.5px;letter-spacing:.03em;margin:0 2px 7px;color:var(--muted);text-transform:uppercase}
  .field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;
    padding:13px 14px;font-family:var(--font-body);font-size:15px;font-weight:600}
  .field textarea{resize:vertical;min-height:84px;line-height:1.45}
  .field input:focus,.field textarea:focus,.field select:focus{outline:3px solid rgba(44,163,151,.35);border-color:var(--teal)}
  .catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .catgrid .opt{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 12px;cursor:pointer;font-weight:700;font-size:13.5px}
  .catgrid .opt[aria-pressed="true"]{border-color:var(--teal);background:rgba(44,163,151,.1)}
  .catgrid .opt .e{font-size:18px}
  .steps{display:flex;align-items:center;gap:12px}
  .steps button{width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:22px;font-family:var(--font-display);cursor:pointer;flex:none}
  .steps .v{font-family:var(--font-display);font-weight:600;font-size:22px;min-width:64px;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}

  .balance{background:linear-gradient(155deg,#2ca397,#227f75);color:#fff;border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .balance::after{content:"🌱";position:absolute;right:-10px;bottom:-18px;font-size:92px;opacity:.14}
  .balance .k{font-size:12.5px;opacity:.9;letter-spacing:.04em;font-weight:700}
  .balance .big{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1;margin:5px 0 2px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .balance .big small{font-size:16px;font-weight:600;opacity:.9}
  .balance .note{font-size:12.5px;opacity:.9;margin-top:4px}
  .section-h{font-family:var(--font-display);font-weight:600;font-size:16px;margin:20px 2px 10px}
  .ledger{display:flex;flex-direction:column;gap:8px}
  .led{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
  .led .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
  .led .t{flex:1;min-width:0}
  .led .t b{font-weight:800;font-size:14px;display:block}
  .led .t span{font-size:12px;color:var(--muted)}
  .led .amt{font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .amt.plus{color:var(--good)}.amt.minus{color:var(--accent-ink)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .amt.minus{color:var(--accent)}}
  :root[data-theme="dark"] .amt.minus{color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:34px 20px;font-weight:600}
  .empty .e{font-size:40px;display:block;margin-bottom:10px}

  /* ---------- animated village ---------- */
  .vscene{position:relative;height:min(46vh,330px);min-height:250px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-soft);border:1.5px solid var(--line)}
  .vscene .vbg{position:absolute;inset:0;width:100%;height:100%}
  .vplate{position:absolute;top:12px;left:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;
    font-family:var(--font-display);font-weight:600;font-size:13px;box-shadow:var(--shadow-soft);z-index:5;display:flex;align-items:center;gap:6px}
  .walker{position:absolute;width:48px;height:54px;background:none;border:none;padding:0;cursor:pointer;z-index:2;will-change:transform,left,top}
  .walker svg{width:100%;height:100%;display:block}
  .walker::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:26px;height:7px;border-radius:50%;background:rgba(30,40,30,.16)}
  .walker .crown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:15px;z-index:3}
  .addfab{position:absolute;right:12px;bottom:12px;z-index:6;background:var(--accent);color:#fff;border:3px solid var(--surface);border-radius:999px;
    padding:9px 15px 9px 12px;font-family:var(--font-display);font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 6px 14px rgba(240,138,99,.4);display:flex;align-items:center;gap:6px}
  .vmeta{display:flex;gap:10px;margin:14px 0 4px}
  .vmeta .vm{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:center;box-shadow:var(--shadow-soft)}
  .vmeta .vm .num{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1}
  .vmeta .vm .lab{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.03em;margin-top:3px;text-transform:uppercase}

  /* ---------- map ---------- */
  .mapwrap{position:relative;width:100%;height:min(54vh,460px);min-height:320px;overflow:hidden;background:var(--map-land);border:1.5px solid var(--line);border-radius:var(--r-lg)}
  .mapwrap svg.base{position:absolute;inset:0;width:100%;height:100%}
  .pin{position:absolute;transform:translate(-50%,-100%);background:none;border:none;padding:0;cursor:pointer;z-index:2;transition:transform .14s ease}
  .pin .drop{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--surface);border:2.5px solid var(--pc,var(--teal));box-shadow:0 4px 10px rgba(0,0,0,.22);position:relative}
  .pin .drop::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border:6px solid transparent;border-top-color:var(--pc,var(--teal))}
  .pin[aria-pressed="true"]{transform:translate(-50%,-100%) scale(1.22);z-index:5}
  .pin[aria-pressed="true"] .drop{border-color:var(--accent)}
  .pin.dim{opacity:.32}
  .youpin{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
  .youpin .ring{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 4px rgba(240,138,99,.3);animation:pulse 2.2s ease-in-out infinite}
  .youpin .lab{font-family:var(--font-display);font-weight:600;font-size:11px;color:var(--ink);background:var(--surface);padding:1px 8px;border-radius:999px;border:1.5px solid var(--line)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(240,138,99,.3)}50%{box-shadow:0 0 0 9px rgba(240,138,99,.05)}}
  .mprev{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;display:flex;gap:12px;align-items:center;transform:translateY(150%);transition:transform .26s cubic-bezier(.2,.8,.3,1)}
  .mprev.show{transform:translateY(0)}
  .mprev .body{flex:1;min-width:0}
  .mprev b{font-family:var(--font-display);font-weight:600;font-size:14.5px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mprev span{font-size:12px;color:var(--muted);font-weight:700}
  .mprev .go{flex:none;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-family:var(--font-display);font-weight:600;font-size:13.5px;cursor:pointer}

  /* ---------- chats ---------- */
  .trow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;margin-bottom:10px}
  .trow .body{flex:1;min-width:0}
  .trow .body b{font-family:var(--font-display);font-weight:600;font-size:15px;display:block}
  .trow .body span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tstat{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
  .tstat.arranging{background:var(--surface-2);color:var(--muted)}
  .tstat.reserved{background:rgba(240,178,62,.18);color:#9a7417}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tstat.reserved{color:var(--gold)}}
  :root[data-theme="dark"] .tstat.reserved{color:var(--gold)}
  .tstat.done{background:rgba(78,156,107,.18);color:var(--good)}
  .chat{display:flex;flex-direction:column;min-height:calc(100% - 0px)}
  .chat-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1.5px solid var(--line);margin-bottom:12px}
  .chat-head .back{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none;color:var(--ink)}
  .chat-head .ti{flex:1;min-width:0}
  .chat-head .ti b{font-family:var(--font-display);font-weight:600;font-size:16px;display:block;line-height:1.1}
  .chat-head .ti span{font-size:12px;color:var(--muted)}
  .ctx{background:var(--surface-2);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;gap:7px;align-items:center}
  .bubbles{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4}
  .bub.them{background:var(--surface-2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
  .bub.me{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .bub.sys{align-self:center;background:rgba(240,178,62,.16);color:#9a7417;font-weight:700;font-size:12.5px;text-align:center;border-radius:999px;padding:6px 14px}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bub.sys{color:var(--gold)}}
  :root[data-theme="dark"] .bub.sys{color:var(--gold)}
  .chat-act{margin-bottom:12px}
  .chat-input{display:flex;gap:9px;align-items:flex-end;position:sticky;bottom:0;background:var(--surface);padding-top:6px}
  .chat-input textarea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:16px;padding:11px 14px;font-family:var(--font-body);font-size:15px;font-weight:600;resize:none;height:44px;max-height:110px}
  .chat-input textarea:focus{outline:3px solid rgba(44,163,151,.35);border-color:var(--teal)}
  .chat-input .send{flex:none;width:44px;height:44px;border-radius:14px;border:none;background:var(--teal);color:#fff;font-size:19px;cursor:pointer}

  /* ---------- bottom nav ---------- */
  .nav{position:sticky;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1.5px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(43,58,44,.07)}
  .nav button{flex:1;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-family:var(--font-body);font-weight:800;font-size:10.5px;letter-spacing:.02em;transition:.15s}
  .nav button .ico{font-size:21px;line-height:1;transition:transform .15s}
  .nav button[aria-pressed="true"]{color:var(--teal)}
  .nav button[aria-pressed="true"] .ico{transform:translateY(-2px) scale(1.08)}
  .nav .vico{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#dff1ef;display:grid;place-items:center;border:2px solid currentColor}
  .nav .vico svg{width:118%;height:118%;margin-top:10%}

  function buildWalkers(){
    var scene=document.getElementById("vscene");if(!scene)return;
    walkers=[];
    var people=state.village.map(function(v,i){return {v:v,vi:i};});
    people.push({v:{__me:true,char:state.player.char},vi:-1});
    people.forEach(function(p){
      var el=document.createElement("button");el.className="walker";
      el.innerHTML=(p.v.__me?'<span class="crown">👑</span>':'')+characterSVG(p.v.char);
      if(p.vi>=0)el.setAttribute("data-vi",p.vi);else el.setAttribute("aria-label","You");
      scene.appendChild(el);
      var x=10+Math.random()*80,y=58+Math.random()*30;
      walkers.push({el:el,x:x,y:y,tx:x,ty:y,sp:2.2+Math.random()*2.2,pause:Math.random()*2.5,flip:1,ph:Math.random()*6});
    });
    place();
    if(!reduce){lastTs=0;animId=requestAnimationFrame(tick);}
  }
  function place(){walkers.forEach(function(w){w.el.style.left=w.x+"%";w.el.style.top=w.y+"%";w.el.style.transform="translate(-50%,-100%) scaleX("+w.flip+")";w.el.style.zIndex=Math.round(w.y);});}
  function tick(ts){
    if(!lastTs)lastTs=ts;var dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;
    walkers.forEach(function(w){
      if(w.pause>0){w.pause-=dt;}
      else{var dx=w.tx-w.x,dy=w.ty-w.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<1.2){w.tx=8+Math.random()*84;w.ty=56+Math.random()*32;w.pause=0.6+Math.random()*3;}
        else{var step=w.sp*dt;w.x+=dx/d*step;w.y+=dy/d*step;w.flip=dx<0?-1:1;}}
      w.ph+=dt*9;var bob=w.pause>0?0:Math.abs(Math.sin(w.ph))*2.2;
      w.el.style.left=w.x+"%";w.el.style.top=w.y+"%";
      w.el.style.transform="translate(-50%,-100%) translateY("+(-bob)+"px) scaleX("+w.flip+")";
      w.el.style.zIndex=Math.round(w.y);
    });
    animId=requestAnimationFrame(tick);
  }

  function pickerHTML(d){

    return species+row(isPerson?"Skin":"Fur","skin",pal(d),true)+(isPerson?row("Hair","hair",HAIRS,false):"")+row(isPerson?"Hair colour":"Markings","haircolor",HAIRCOLORS,true)+row("Shirt","shirt",["#f08a63","#2ca397","#f0b23e","#6fae4e","#8a6fd0","#d9608a","#4a9fd0"],true)+row("Extra","acc",ACCS,false);

  // ---------- chats ----------
  function getThread(id){for(var i=0;i<state.threads.length;i++)if(state.threads[i].id===id)return state.threads[i];}
  function startThread(it,role){
    var ex=null;for(var i=0;i<state.threads.length;i++)if(state.threads[i].itemId===it.id)ex=state.threads[i];
    if(ex){openThread(ex.id);return;}
    var opener=role==="client"?("Hi "+first(it.name)+"! I'd love to take you up on “"+it.title+"”. When works?"):
      role==="provider"?("Hi "+first(it.name)+"! I can help with “"+it.title+"”. When’s good?"):
      ("Hi "+first(it.name)+"! I’d love to join your pact “"+it.title+"”.");
    var t={id:threadSeq++,name:it.name,cat:it.cat,itemId:it.id,role:role,status:"arranging",msgs:[{me:true,text:opener}]};
    state.threads.unshift(t);
    if(role==="provider"||role==="joiner")addVillager(it.name,it.cat,role==="joiner"?("Pact: "+it.title):("You helped: "+it.title),"app");
    closeSheet();openThread(t.id);
    setTimeout(function(){t.msgs.push({me:false,text:REPLIES[rnd(REPLIES.length)]});if(state.chatOpen===t.id)renderThread(t);},750);
  }
  function openThread(id){state.chatOpen=id;state.tab="chats";setNav();render();}
  function renderChats(){
    screen.className="screen";
    if(state.chatOpen){var t=getThread(state.chatOpen);if(t){renderThread(t);return;}state.chatOpen=null;}
    if(!state.threads.length){screen.innerHTML='<div class="screen-title">Chats 💬</div>'+emptyFeed("No conversations yet. Message a neighbor from a listing to arrange a trade.");return;}
    var rows=state.threads.map(function(t){var it=byId(t.itemId)||{name:t.name,cat:t.cat};var last=t.msgs[t.msgs.length-1];
      return '<div class="trow" data-thread="'+t.id+'">'+avatar({name:t.name,cat:t.cat})+'<div class="body"><b>'+esc(first(t.name))+'</b><span>'+(last.me?"You: ":"")+esc(last.text)+'</span></div><span class="tstat '+t.status+'">'+t.status+'</span></div>';}).join("");
    screen.innerHTML='<div class="screen-title">Chats 💬</div><div class="screen-sub">Arrange your trades here. A trade’s status rides along the top of each chat.</div>'+rows;
  }
  function renderThread(t){
    var it=byId(t.itemId)||{title:"a trade",cat:t.cat,name:t.name,cost:0};
    var bubbles=t.msgs.map(function(m){return '<div class="bub '+(m.sys?"sys":m.me?"me":"them")+'">'+esc(m.text)+'</div>';}).join("");
    var ctxCost=it.cost==="barter"?"Barter":it.cost==="pact"?"Weekly pact":(typeof it.cost==="number"?it.cost+" 🌱":"");
    var act="";
    if(t.status==="arranging"){
      if(t.role==="client")act=typeof it.cost==="number"?'<button class="btn btn-primary" data-reserve="'+it.id+'">🌱 Reserve '+it.cost+' 🌱 & lock it in</button>':'<button class="btn btn-primary" data-barter="'+it.id+'">🔁 Agree to the barter</button>';
      else if(t.role==="provider")act='<button class="btn btn-teal" data-done="'+t.id+'">✅ Mark complete & earn'+(typeof it.cost==="number"?" "+it.cost+" 🌱":"")+'</button>';
      else act='<button class="btn btn-teal" data-done="'+t.id+'">🤝 Confirm the pact</button>';
    } else if(t.status==="reserved"){
      act='<button class="btn btn-teal" data-done="'+t.id+'">✅ Mark complete & rate</button>';
    } else {act='<div style="text-align:center;color:var(--good);font-weight:800;font-size:13px;padding:4px">✓ Trade complete</div>';}
    screen.innerHTML='<div class="chat"><div class="chat-head"><button class="back" id="chatBack">←</button>'+avatar({name:t.name,cat:t.cat})+
      '<div class="ti"><b>'+esc(first(t.name))+'</b><span>'+CATS[t.cat].e+' '+CATS[t.cat].label+'</span></div><span class="tstat '+t.status+'">'+t.status+'</span></div>'+
      '<div class="ctx">💬 About: '+esc(it.title)+(ctxCost?' · '+ctxCost:'')+'</div>'+
      '<div class="bubbles" id="bubbles">'+bubbles+'</div>'+
      '<div class="chat-act">'+act+'</div>'+
      '<div class="chat-input"><textarea id="msgIn" placeholder="Message '+esc(first(t.name))+'…" rows="1"></textarea><button class="send" id="msgSend">➤</button></div></div>';
    document.getElementById("chatBack").onclick=function(){state.chatOpen=null;render();};
    document.getElementById("msgSend").onclick=function(){sendMsg(t);};
    document.getElementById("msgIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg(t);}});
    var b=document.getElementById("bubbles");if(b)b.scrollIntoView&&window.scrollTo(0,document.body.scrollHeight);
  }
  function sendMsg(t){var inp=document.getElementById("msgIn");var v=inp.value.trim();if(!v)return;
    t.msgs.push({me:true,text:v});renderThread(t);
    setTimeout(function(){t.msgs.push({me:false,text:REPLIES[rnd(REPLIES.length)]});if(state.chatOpen===t.id)renderThread(t);},800);}
  function pushSys(t,text){t.msgs.push({sys:true,text:text});}

  // ---------- sheets ----------
  function showSheet(html){sheet.removeEventListener("click",sheetPick);sheet.innerHTML='<div class="grab"></div>'+html;scrim.classList.add("show");sheet.classList.add("show");sheet.scrollTop=0;}

  function openItemSheet(it){

    var dealLabel=it.cost==="barter"?"Open to a trade":it.cost==="pact"?"Even swap — no sprouts":(it.type==="request"?"You’d earn":"Costs you");

    var actions=isMine?'<button class="btn btn-ghost" data-close>This is your post · Close</button>':
      '<button class="btn btn-primary" data-msg="'+it.id+'" data-role="'+role+'">'+actLabel+'</button><button class="btn btn-ghost" data-close>Maybe later</button>';
    showSheet('<div class="sh-head">'+avatar(it)+'<div><h2>'+esc(it.title)+'</h2><div class="sh-meta"><span>'+esc(it.name)+'</span><span>·</span><span>'+dist+'</span><span>·</span>'+rateHTML(it)+'</div></div></div>'+
      '<div class="blurb">'+esc(it.blurb)+'</div>'+reviewBlock+

      '<div class="actions">'+actions+'<p style="color:var(--muted);font-size:12px;text-align:center;margin:4px 2px 0;line-height:1.4">You’ll chat to agree on details first. Sprouts are only reserved once you confirm — and you rate each other after it’s done.</p></div>');
  }
  function openConfirm(it){var cost=typeof it.cost==="number"?it.cost:0,after=state.balance-cost,short=after<0;
    showSheet('<h2 style="margin:2px 0 14px">Confirm & reserve</h2><div class="sh-head" style="margin-bottom:14px">'+avatar(it)+'<div><h2 style="font-size:17px">'+esc(it.title)+'</h2><div class="sh-meta"><span>'+esc(it.name)+'</span><span>·</span>'+rateHTML(it)+'</div></div></div>'+
      '<div class="escrow"><div class="ln"><span>Your sprouts now</span><span>'+state.balance+' 🌱</span></div><div class="ln"><span>Reserved for '+esc(first(it.name))+'</span><span>'+(cost?'−'+cost+' 🌱':'Barter')+'</span></div><div class="ln tot"><span>Balance after</span><span>'+(short?state.balance:after)+' 🌱</span></div>'+(short?'<div class="warn">Not enough sprouts — earn some by helping a neighbor first 🌱</div>':'')+'</div>'+
      '<p style="color:var(--muted);font-size:12.5px;text-align:center;margin:0 4px 16px;line-height:1.5">Sprouts are held safely until you both mark it done. Nothing is final yet.</p>'+
      '<div class="actions"><button class="btn btn-primary" data-reserve2="'+it.id+'"'+(short?' disabled':'')+'>Confirm & reserve'+(cost?' '+cost+' 🌱':'')+'</button><button class="btn btn-ghost" data-close>Back</button></div>');
  }
  function doReserve(it){var cost=typeof it.cost==="number"?it.cost:0;if(cost>state.balance)return;
    state.balance-=cost;if(cost>0)state.activity.unshift({ic:CATS[it.cat].e,cat:it.cat,t:"Reserved: "+it.title+" · "+it.name,s:"Just now",amt:-cost});
    addVillager(it.name,it.cat,"You got: "+it.title,"app");
    var t=getThread(state.actThread);if(t){t.status="reserved";pushSys(t,cost>0?("🌱 You reserved "+cost+" sprouts for "+first(it.name)+". Held until you both mark it done."):"🔁 Barter agreed.");}
    closeSheet();toast(first(it.name)+" moved into your village! 🏡");if(t)renderThread(t);else setTab("village");}
  function doBarter(it){addVillager(it.name,it.cat,"You got: "+it.title,"app");var t=getThread(state.actThread);
    if(t){t.status="reserved";pushSys(t,"🔁 Barter agreed. Mark it complete when you’ve swapped.");renderThread(t);}toast(first(it.name)+" moved into your village! 🏡");}
  function completeThread(t){
    var it=byId(t.itemId)||{cost:0,name:t.name,cat:t.cat,title:"trade"};
    if(t.role==="provider"){var reward=typeof it.cost==="number"?it.cost:0;state.balance+=reward;
      if(reward>0)state.activity.unshift({ic:CATS[it.cat].e,cat:it.cat,t:"Earned: "+it.title+" · "+it.name,s:"Just now",amt:reward});
      t.status="done";pushSys(t,reward>0?("✅ Complete! You earned "+reward+" 🌱. "+first(it.name)+" rated you ⭐"):"✅ Complete! Thanks for helping.");renderThread(t);
      toast(reward>0?("You earned "+reward+" 🌱!"):"All done — thanks for helping 🙌");
    } else if(t.role==="joiner"){t.status="done";pushSys(t,"🤝 Pact on! "+first(it.name)+" is counting on you weekly.");renderThread(t);toast("Pact confirmed 🤝");
    } else {t.status="done";pushSys(t,"✅ Trade complete! Sprouts released to "+first(it.name)+".");renderThread(t);
      openRating(it,function(){var tt=getThread(t.id);if(tt&&state.chatOpen===tt.id)renderThread(tt);});}
  }
  function openRating(target,onDone){var picked=5;
    showSheet('<h2 style="text-align:center;margin:2px 0 4px">How was it with '+esc(first(target.name))+'?</h2><p style="color:var(--muted);font-size:13px;text-align:center;margin:0 0 6px">You can only rate neighbors you’ve actually traded with.</p>'+
      '<div class="starpick" id="starpick">'+[1,2,3,4,5].map(function(n){return '<button data-star="'+n+'" class="'+(n<=picked?"on":"")+'">⭐</button>';}).join("")+'</div>'+
      '<div class="field"><label>Add a note (optional)</label><textarea id="rNote" placeholder="What made it great? Anything others should know?"></textarea></div>'+
      '<div class="actions"><button class="btn btn-primary" id="rSubmit">Submit rating</button><button class="btn btn-ghost" data-close>Skip</button></div>');
    var sp=document.getElementById("starpick");sp.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;picked=+b.dataset.star;
      Array.prototype.forEach.call(sp.children,function(btn){btn.classList.toggle("on",+btn.dataset.star<=picked);});});
    document.getElementById("rSubmit").onclick=function(){if(target.reviews!=null){target.reviews+=1;target.rating=Math.round(((target.rating*0.9)+(picked*0.1))*10)/10;}
      closeSheet();toast("Thanks! You rated "+first(target.name)+" "+"⭐".repeat(picked));if(onDone)onDone();};
  }

  function renderVerify(){topEl.hidden=true;navEl.hidden=true;screen.className="screen";screen.style.padding="0";

      '<div class="auth-btns">'+
      '<button class="auth-btn" data-verify="id"><span class="lmark v">🪪</span><span class="txt">Photo ID<span class="sub">Any government, consular, or foreign ID</span></span></button>'+
      '<button class="auth-btn" data-verify="selfie"><span class="lmark v">🤳</span><span class="txt">Quick selfie check<span class="sub">No documents needed at all</span></span></button>'+
      '<button class="auth-btn" data-verify="vouch"><span class="lmark v">🤝</span><span class="txt">Get vouched<span class="sub">Have two Clover members confirm you</span></span></button>'+
      '<button class="auth-btn" data-verify="phone"><span class="lmark v">📱</span><span class="txt">Phone + address<span class="sub">A simple reachable-and-local check</span></span></button></div>'+
      '<div class="legal">Your ID is used only to confirm you’re real, then deleted. It is never shown to other neighbors.</div></div>';
    screen.querySelector(".gate").addEventListener("click",function(e){var b=e.target.closest("[data-verify]");if(!b)return;verifying();});
  }
  function verifying(){screen.innerHTML='<div class="gate" style="justify-content:center;text-align:center"><div class="spinner"></div>'+
    '<h1 style="font-size:24px">Checking…</h1><div class="tag">Confirming you’re a real neighbor. This only takes a moment.</div></div>';
    setTimeout(function(){state.stage="create";state.draftChar=cloneChar(state.player.char);render();toast("You’re verified ✓");},1400);}
  // ---------- creator ----------
  function renderCreate(){topEl.hidden=true;navEl.hidden=true;screen.className="screen";screen.style.padding="";
    screen.innerHTML='<div style="text-align:center;padding-top:6px"><div class="screen-title" style="font-size:24px">Create your villager 🌱</div><div class="screen-sub">Be a person or an animal. This is how neighbors see you — and who lives in your village.</div></div>'+
      '<div class="charprev" id="createPrev">'+characterSVG(state.draftChar)+'</div><div style="text-align:center;margin:10px 0 16px"><button class="opt2" id="createRandom">🎲 Surprise me</button></div>'+
      '<div class="field"><label>Your name</label><input id="cName" maxlength="24" value="'+esc(state.player.name)+'" placeholder="What should neighbors call you?"></div>'+
      '<div id="createPickers">'+pickerHTML(state.draftChar)+'</div>'+
      '<button class="btn btn-primary" id="createDone" style="margin-top:6px">Enter Clover 🍀</button><button class="btn btn-ghost" id="createSkip" style="margin-top:9px">Skip for now</button>';
    screen.addEventListener("click",createPick);
    document.getElementById("createRandom").onclick=function(){state.draftChar=randomChar();redrawPickers("createPrev","createPickers");};
    document.getElementById("createDone").onclick=finishCreate;document.getElementById("createSkip").onclick=finishCreate;
  }
  function createPick(e){var b=e.target.closest("[data-pk]");if(!b)return;var key=b.getAttribute("data-pk"),i=+b.getAttribute("data-i");
    if(key==="species")state.draftChar.skin=Math.min(state.draftChar.skin,(SPECIES[i].k==="person"?SKINS:FURS).length-1);
    state.draftChar[key]=i;redrawPickers("createPrev","createPickers");}
  function finishCreate(){var n=document.getElementById("cName");state.player.name=(n&&n.value.trim())||"You";state.player.char=cloneChar(state.draftChar);
    screen.removeEventListener("click",createPick);state.stage="app";setTab("village");toast("Welcome to Echo Park 🍀");}

  render();
})();
</script>
